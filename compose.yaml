services:
  xaubot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # The feed is written externally by your broker export process.
    # No MT5 credentials or trade placement capabilities in this container.
    command:
      - python
      - -m
      - xaubot
      - scan
      - --csv
      - /app/data/xauusd_m1.csv
      - --watch
      - --poll
      - "30"
      - --out
      - /app/data/candidates.json
      - --state
      - /app/data/discord_seen.json

  commands:
    build: .
    profiles: ["commands"]
    restart: unless-stopped
    env_file: .env
    environment:
      XAUBOT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    command: ["python", "-m", "xaubot.discord_commands"]
    # Slash commands are explicitly read-only; no MT5 or broker connection.

  forward:
    build: .
    profiles: ["forward"]
    restart: unless-stopped
    # Explicitly disabled until the operator has INDEPENDENTLY verified UTC offset.
    environment:
      XAUBOT_BROKER_OFFSET_VERIFIED: "${XAUBOT_BROKER_OFFSET_VERIFIED:-0}"
      XAUBOT_BROKER_UTC_OFFSET_MINUTES: "${XAUBOT_BROKER_UTC_OFFSET_MINUTES:-120}"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/app/data
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    command:
      - sh
      - -ec
      - >-
        test "$$XAUBOT_BROKER_OFFSET_VERIFIED" = "1"
        || { echo "Forward journal disabled: verify broker UTC offset first" >&2; exit 2; };
        exec python -m xaubot.forward
        --csv /app/data/xauusd_m1.csv
        --state /app/data/forward_journal.json
        --expected-offset-minutes "$$XAUBOT_BROKER_UTC_OFFSET_MINUTES"
        --offset-verified --watch --poll 30
    # Forward signals are append-only research, with no Discord, AI or order API.

  optimizer:
    build: .
    profiles: ["optimizer"]
    # Opt-in one-shot offline development replay. No login/API/Discord secrets.
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/app/data
    command:
      - python
      - -m
      - xaubot.optimizer
      - once
      - --config
      - /app/data/optimizer_config.json

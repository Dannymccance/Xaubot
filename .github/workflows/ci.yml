name: Python CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m xaubot strategies > /tmp/xaubot-strategies.json
      - run: python -c "import json; assert json.load(open('/tmp/xaubot-strategies.json'))['count'] == 201"

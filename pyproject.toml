[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaubot"
version = "0.1.0"
description = "Paper-only XAUUSD GWS-style research and 201-strategy laboratory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
discord = ["discord.py>=2.4,<3"]
mt5 = ["MetaTrader5>=5.0"]

[project.scripts]
xaubot = "xaubot.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
